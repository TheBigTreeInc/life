- path: /session
  method: POST
  kind: python
  source: "# Bundled inline in looprd.yaml. The Python handler is trusted Looprd code.\n# Looprd v1 WebSockets are\
    \ SUBSCRIPTION ONLY; mutations use HTTP.\nimport hashlib\nimport hmac\nimport json\nimport secrets\nimport time\n\
    import sqlalchemy as sa\nfrom starlette.concurrency import run_in_threadpool\n\nALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'\n\
    TTL = 48 * 3600\nRoom = sa.table('Room',\n    sa.column('id', sa.Integer), sa.column('codeHash', sa.String),\n\
    \    sa.column('hostHash', sa.String), sa.column('guestHash', sa.String),\n    sa.column('guestName', sa.String),\
    \ sa.column('chatKey', sa.String), sa.column('state', sa.JSON),\n    sa.column('pending', sa.JSON), sa.column('lastResult',\
    \ sa.JSON),\n    sa.column('version', sa.Integer), sa.column('signal', sa.Integer),\n    sa.column('touched',\
    \ sa.Integer))\n\ndef digest(value):\n    return hashlib.sha256(value.encode('utf-8')).hexdigest()\n\ndef fail(reason):\n\
    \    return {'ok': False, 'error': reason}\n\ndef valid_snapshot(state):\n    if not isinstance(state, dict)\
    \ or not isinstance(state.get('players'), list):\n        return False\n    if state.get('settings', {}).get('mode')\
    \ != 'hotseat' or len(state['players']) != 3:\n        return False\n    if [x.get('id') for x in state['players']]\
    \ != ['player', 'friend', 'jones']:\n        return False\n    try:\n        return len(json.dumps(state, separators=(',',\
    \ ':'))) < 360000\n    except (TypeError, ValueError):\n        return False\n\nAPPEARANCE_OPTIONS = {\n   \
    \ 'schemaVersion': {1},\n    'catalogVersion': {'2026-10-12.1'},\n    'body': {'compact','standard','broad'},\n\
    \    'headwear': {'none','cap','beanie'},\n    'skin': {'peach','tan','brown','deep','pale','olive'},\n    'hair':\
    \ {'short','long','curly','bun','buzz','swept'},\n    'hairColor': {'black','brown','auburn','blonde','silver','mint'},\n\
    \    'outfit': {'everyday','smart','sport','creative'},\n    'accent': {'forest','coral','violet','sky','gold','rose'},\n\
    \    'mood': {'smile','calm','focused'},\n    'personality': {'curious','kind','bold','thoughtful'},\n    'portrait':\
    \ {'','pixel'} | {f'illustrated-{i:02d}' for i in range(1,17)} | {f'original-{i:02d}' for i in range(1,36)},\n\
    }\nAPPEARANCE_DEFAULTS = {'schemaVersion':1,'catalogVersion':'2026-10-12.1','body':'standard','headwear':'none','skin':'peach','hair':'short','hairColor':'brown','outfit':'everyday',\n\
    \                       'accent':'forest','mood':'smile','personality':'curious','portrait':''}\nACCENT_COLORS\
    \ = {'forest':'#367b5d','coral':'#dc7a6a','violet':'#8274c7',\n                 'sky':'#4683b0','gold':'#c48a35','rose':'#c26b99'}\n\
    \ndef guest_appearance(value):\n    if not isinstance(value, dict):\n        value = {}\n    return {key: value.get(key)\
    \ if isinstance(value.get(key), (str,int)) and value.get(key) in options else APPEARANCE_DEFAULTS[key]\n   \
    \         for key, options in APPEARANCE_OPTIONS.items()}\n\ndef replace_guest_identity(state, name, appearance):\n\
    \    # This is an actual persisted multiplayer snapshot, not the browser's private profile library.\n    updated\
    \ = json.loads(json.dumps(state))\n    guest = updated['players'][1]\n    guest['name'] = name\n    if appearance\
    \ is not None:\n        guest['appearance'] = appearance\n        guest['color'] = ACCENT_COLORS[appearance['accent']]\n\
    \    return updated\n\ndef execute(body, sessions):\n    if not isinstance(body, dict):\n        return fail('Invalid\
    \ request'), None\n    op = body.get('op')\n    now = int(time.time())\n    event = None\n    with sessions.begin()\
    \ as db:\n        if op == 'create':\n            state = body.get('state')\n            if not valid_snapshot(state):\n\
    \                return fail('A valid two-human hotseat game is required'), None\n            db.execute(sa.delete(Room).where(Room.c.touched\
    \ < now - TTL))\n            host = secrets.token_urlsafe(32)\n            chat_key = secrets.token_urlsafe(32)\n\
    \            code = ''.join(secrets.choice(ALPHABET) for _ in range(10))\n            # The random join code\
    \ is not used as the privileged host token.\n            db.execute(sa.insert(Room).values(codeHash=digest(code),\
    \ hostHash=digest(host),\n                guestHash=None, guestName=None, chatKey=chat_key, state=state, pending=None,\
    \ lastResult=None,\n                version=1, signal=0, touched=now))\n            return {'ok': True, 'code':\
    \ code, 'token': host, 'role': 'host', 'version': 1, 'state': state, 'joined': False, 'chatKey':chat_key}, None\n\
    \        code = str(body.get('code') or '').strip().upper()\n        if len(code) != 10 or any(x not in ALPHABET\
    \ for x in code):\n            return fail('Invalid game code'), None\n        record = db.execute(sa.select(Room).where(Room.c.codeHash\
    \ == digest(code))).mappings().first()\n        if record is None or record['touched'] < now - TTL:\n      \
    \      return fail('Session not found or expired'), None\n        rid = record['id']\n        if op == 'join':\n\
    \            if record['guestHash']:\n                return fail('This game already has two people'), None\n\
    \            guest = secrets.token_urlsafe(32)\n            name = str(body.get('name') or 'Friend').strip()[:24]\
    \ or 'Friend'\n            appearance = guest_appearance(body.get('appearance'))\n            state = replace_guest_identity(record['state'],\
    \ name, appearance)\n            db.execute(sa.update(Room).where(Room.c.id == rid).values(guestHash=digest(guest),\n\
    \                guestName=name, state=state, version=record['version']+1, touched=now, signal=record['signal']\
    \ + 1))\n            event = {'component':'the-life-loop', 'resource':'pulses', 'action':'updated',\n      \
    \          'id':rid, 'data':{'id':rid, 'signal':record['signal']+1}}\n            return {'ok':True, 'role':'guest',\
    \ 'code':code, 'token':guest,\n                'state':state, 'version':record['version']+1, 'joined':True,\
    \ 'chatKey':record['chatKey']}, event\n        token = str(body.get('token') or '')\n        hashed = digest(token)\n\
    \        host = hmac.compare_digest(hashed, record['hostHash']) if token else False\n        guest = bool(token\
    \ and record['guestHash'] and hmac.compare_digest(hashed, record['guestHash']))\n        if not (host or guest):\n\
    \            return fail('Invalid or expired participant token'), None\n        if op == 'status':\n       \
    \     return {'ok':True, 'role':'host' if host else 'guest', 'state':record['state'],\n                'version':record['version'],\
    \ 'joined':bool(record['guestHash']),\n                'guestName':record['guestName'], 'pending':record['pending']\
    \ if host else None,\n                'lastResult':record['lastResult'], 'chatKey':record['chatKey']}, None\n\
    \        if op == 'chat':\n            if not record['guestHash']:\n                return fail('Wait for both\
    \ players to join before chatting'), None\n            packet = body.get('packet')\n            if not isinstance(packet,\
    \ dict) or set(packet) != {'nonce','ciphertext'}:\n                return fail('Invalid chat envelope'), None\n\
    \            import re\n            if (not isinstance(packet['nonce'], str) or not re.fullmatch(r'[A-Za-z0-9_-]{16}',packet['nonce'])\n\
    \                    or not isinstance(packet['ciphertext'],str)\n                    or not re.fullmatch(r'[A-Za-z0-9_-]{20,2400}',packet['ciphertext'])):\n\
    \                return fail('Invalid encrypted chat payload'), None\n            # Never store chat content\
    \ in Room, Pulse, game snapshots or event history.\n            # The native Looprd WebSocket only emits events;\
    \ HTTP is the authenticated send path.\n            event = {'component':'the-life-loop', 'resource':'pulses',\
    \ 'action':'updated', 'id':rid,\n                     'data':{'id':rid,'chat':{'nonce':packet['nonce'],\n  \
    \                                          'ciphertext':packet['ciphertext']}}}\n            return {'ok':True,\
    \ 'delivered':'websocket-notification'}, event\n        if op == 'send':\n            if not guest:\n      \
    \          return fail('Only the guest can submit remote turns'), None\n            active = record['state'].get('active')\n\
    \            players = record['state'].get('players', [])\n            if not isinstance(active,int) or not\
    \ 0<=active<len(players) or players[active].get('id')!='friend':\n                return fail('It is not your\
    \ turn'), None\n            if record['pending'] is not None:\n                return fail('Previous action\
    \ is still processing'), None\n            if body.get('version') != record['version']:\n                return\
    \ fail('State changed: resynchronize first'), None\n            command = body.get('command')\n            if\
    \ not isinstance(command,dict) or command.get('type') not in ['travel','act','endTurn','choose']:\n        \
    \        return fail('Unknown game action'), None\n            arg = command.get('arg')\n            if command['type']!='endTurn'\
    \ and (not isinstance(arg,str) or len(arg)>100 or not arg):\n                return fail('Invalid action argument'),\
    \ None\n            action = {'id':secrets.token_hex(12), 'type':command['type'], 'arg':arg}\n            db.execute(sa.update(Room).where(Room.c.id\
    \ == rid).values(pending=action,\n                touched=now, signal=record['signal']+1))\n            event\
    \ = {'component':'the-life-loop', 'resource':'pulses', 'action':'updated',\n                'id':rid, 'data':{'id':rid,\
    \ 'signal':record['signal']+1}}\n            return {'ok':True, 'queued':action['id']}, event\n        if op\
    \ == 'publish':\n            if not host:\n                return fail('Only the host can publish game state'),\
    \ None\n            state = body.get('state')\n            if not valid_snapshot(state):\n                return\
    \ fail('Invalid game snapshot'), None\n            if body.get('version') != record['version']:\n          \
    \      return fail('Stale game version'), None\n            pending = record['pending']\n            if pending\
    \ and body.get('commandId') != pending['id']:\n                return fail('A remote command must be acknowledged\
    \ first'), None\n            new_version = record['version']+1\n            last_result = {'commandId':pending['id'],\
    \ 'ok':bool(body.get('actionOk')),\n                'message':str(body.get('message') or '')[:300]} if pending\
    \ else None\n            db.execute(sa.update(Room).where(Room.c.id == rid).values(\n                state=state,\
    \ pending=None, version=new_version, signal=record['signal']+1,\n                lastResult=last_result, touched=now))\n\
    \            event = {'component':'the-life-loop', 'resource':'pulses', 'action':'updated',\n              \
    \  'id':rid, 'data':{'id':rid, 'signal':record['signal']+1}}\n            return {'ok':True, 'version':new_version},\
    \ event\n        return fail('Unknown operation'), None\n\nasync def handle(ctx):\n    outcome, event = await\
    \ run_in_threadpool(execute, ctx.body, ctx.session_factory)\n    if event is not None:\n        ctx.publish(event)\
    \   # after successful transaction commit\n    return outcome\n"
